name: Deploy to GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight run finish rather than
# cancelling it, so a page load never hits a half-deployed site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Site content only — leaves out sections/ (draft copy), CLAUDE.md,
      # .vscode/ and .github/ itself. Each page directory is listed
      # explicitly: a new top-level page won't appear on the live site
      # until it's added here.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html 404.html _site/
          cp -r css img js about club course creations contact _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
